
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew House</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Brew House</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#menu">Menu</a>
            <a href="#about">About</a>
            <a href="#Myorder">My order</a>
        </nav>
    </header>

    <main>

        <section id="home">
            <h2>Welcome to Brew House</h2>
            <p>Fresh coffee, made with love.</p>
            <a href="#menu">View Menu</a>
        </section>

        <section id="menu">
            <h2>Our Menu</h2>

<input type="text" id="search" placeholder="Srarch coffee...">

<div class="menu-container" id="menu-container"></div>

        </section>




        <section id="about">
            <h2>About Us</h2>
            <p>We serve delicious coffee every day.</p>
        </section>

        <section id="Myorder">
<h2>My order</h2>
<h3>Order Summary</h3>

<div id="order-list"></div>

<p id="total">Total: 0 SAR</p>

<button onclick="placeOrder()">Place Order</button>

        </section>
    </main>

    <footer>
        <p>Copyright © 2026 Brew House</p>
    </footer>
<script src="script.js"></script>
</body>
</html>
